[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ocr-claim-audit"
version = "0.1.0"
description = "Offline static audit of documented picture-word claims"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
ocr-claim-audit = "ocr_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["ocr_claim_audit*"]
